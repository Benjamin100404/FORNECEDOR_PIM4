<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Produto - MerKdito</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-blob blob-3"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="dashboard.html" class="logo">
                <span class="logo-text" style="color: #5DA54A; font-size: 2rem; font-weight: 800; letter-spacing: -1px;">MerKdito</span>
            </a>
            
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="produtos.html" class="nav-item"><i class="fa-solid fa-box-open"></i> Produtos</a></li>
                <li><a href="adicionar_produto.html" class="nav-item active"><i class="fa-solid fa-plus-circle"></i> Adicionar Produto</a></li>
                <li><a href="perfil.html" class="nav-item"><i class="fa-solid fa-user-tie"></i> Meu Perfil</a></li>
            </ul>
            
            <div class="logout-container">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div>
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <a href="produtos.html" style="color: var(--text-dark); text-decoration: none; font-size: 1.2rem;"><i class="fa-solid fa-arrow-left"></i></a>
                        <h1 class="page-title">Adicionar Produto</h1>
                    </div>
                </div>
                <div class="header-actions">
                </div>
            </header>

            <div class="animate-fade-in delay-1">
                <div class="glass-panel form-card">
                    <form action="produtos.html">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Código do Produto *</label>
                                <input type="text" class="form-control" placeholder="Ex: PROD001" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Nome do Produto *</label>
                                <input type="text" class="form-control" placeholder="Ex: Limpador Multiuso" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Setor de Aplicação *</label>
                                <select class="form-control" required>
                                    <option value="">Selecione um setor</option>
                                    <option value="mercearia">Mercearia</option>
                                    <option value="acougue">Açougue e Aves</option>
                                    <option value="hortifruti">Hortifruti</option>
                                    <option value="padaria">Padaria</option>
                                    <option value="laticinios">Laticínios</option>
                                    <option value="frios">Frios e Embutidos</option>
                                    <option value="bebidas">Bebidas</option>
                                    <option value="limpeza">Limpeza</option>
                                    <option value="higiene">Higiene e Perfumaria</option>
                                    <option value="congelados">Congelados</option>
                                    <option value="pet">Pet Shop</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Quantidade Inicial *</label>
                                <input type="number" class="form-control" placeholder="Ex: 50" required>
                            </div>
                        </div>

                        <div class="form-group" style="width: 50%; padding-right: 10px;">
                            <label class="form-label">Preço Unitário (R$) *</label>
                            <input type="number" step="0.01" class="form-control" placeholder="Ex: 25.00" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Foto do Produto</label>
                            <label for="fotoUpload" style="display: block; border: 2px dashed var(--color-teal); border-radius: var(--radius-md); padding: 30px; text-align: center; background-color: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.3s ease;">
                                <i class="fa-solid fa-cloud-arrow-up" style="font-size: 2.5rem; color: var(--color-teal); margin-bottom: 15px;"></i>
                                <p style="margin: 0; color: var(--text-dark); font-weight: 500;">Clique para enviar uma foto</p>
                                <p style="margin: 5px 0 0 0; color: var(--text-muted); font-size: 0.85rem;">Formatos suportados: JPG, PNG, WEBP (Máx 5MB)</p>
                                <input type="file" id="fotoUpload" accept="image/*" style="display: none;">
                            </label>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Descrição</label>
                            <textarea class="form-control" placeholder="Descrição opcional do produto..."></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-box"></i> Adicionar Produto</button>
                            <a href="produtos.html" class="btn btn-outline">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
